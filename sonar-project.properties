sonar.projectKey=lusky3_sportspress-player-merge
sonar.organization=lusk

sonar.sources=.

# Third-party bundles and generated artifacts are not ours to fix.
# tests/** is excluded because the suite deliberately contains hostile fixtures —
# http:// and ftp:// URLs and a literal IP — that exist precisely to prove the
# updater's host allowlist rejects them. Scanning them reports the fixtures as
# vulnerabilities and pushes the security rating off A for code that never ships.
#
# NOTE: assets/js is deliberately NOT excluded. The real DOM-XSS findings in this
# repository were in assets/js/admin.js; only the vendored Select2 bundle is skipped.
sonar.exclusions=**/vendor/**,assets/vendor/**,tests/**,languages/**,**/*.min.js,**/*.min.css
sonar.php.exclusions=**/vendor/**,tests/**

# Produced by `bash tests/run-coverage.sh` (see .github/workflows/security.yml's
# sonarcloud job, which generates it fresh in the same checkout right before
# this analysis runs).
sonar.php.coverage.reportPaths=coverage/clover.xml
