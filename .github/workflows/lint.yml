name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' | xargs -n1 php -l

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: pcov
      - name: Install coverage tooling
        run: composer install --no-interaction --prefer-dist
      - name: Run test suite with coverage
        # tests/run-coverage.sh runs the exact same standalone `php test-*.php`
        # scripts as run-all.sh, same per-file output, same aggregate exit code
        # — plus a merged coverage/clover.xml from every process. No WordPress
        # install or database required.
        run: bash tests/run-coverage.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/clover.xml
          fail_ci_if_error: false

  oxlint:
    name: OxLint (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install oxlint
        # Exact version, and no lifecycle scripts. oxlint declares no scripts and
        # ships its platform binary via optionalDependencies, so --ignore-scripts
        # is a no-op for it while closing the arbitrary-code-on-install path.
        run: npm install -g --ignore-scripts oxlint@1.77.0
      - name: Run oxlint
        run: oxlint assets/js/ --config .oxlintrc.json

  semgrep:
    name: Semgrep (Security Patterns)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        run: semgrep scan --config p/php --config p/wordpress --error

  copy-paste:
    name: Copy-Paste Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run jscpd
        # Pinned and --yes so npx resolves a known version rather than whatever is
        # current at run time. ignore-scripts is set via env so it also covers the
        # on-demand install npx performs before executing.
        #
        # tests/ is excluded: it's a standalone hand-mocked test harness (not
        # shipped code), and repetitive per-scenario setup/assertion scaffolding
        # across test files is expected there — the gate exists to catch
        # duplicated *application* logic, not similarly-shaped test cases.
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: npx --yes jscpd@5.0.14 --min-lines 5 --threshold 5 --ignore 'assets/vendor/**,languages/**,.kiro/**,tests/**'

  a11y:
    name: Accessibility Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check aria attributes in PHP templates
        run: |
          echo "Checking for aria-live on dynamic message containers..."
          grep -r 'aria-live' includes/ || (echo "::error::Missing aria-live on message containers" && exit 1)
          echo "Checking for screen-reader-text in JS..."
          grep -r 'screen-reader-text' assets/js/ || true
          echo "All a11y checks passed"
