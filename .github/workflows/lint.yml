name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' | xargs -n1 php -l

  oxlint:
    name: OxLint (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install oxlint
        # Exact version, and no lifecycle scripts. oxlint declares no scripts and
        # ships its platform binary via optionalDependencies, so --ignore-scripts
        # is a no-op for it while closing the arbitrary-code-on-install path.
        run: npm install -g --ignore-scripts oxlint@1.77.0
      - name: Run oxlint
        run: oxlint assets/js/ --config .oxlintrc.json

  semgrep:
    name: Semgrep (Security Patterns)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run Semgrep
        run: semgrep scan --config p/php --config p/wordpress --error

  copy-paste:
    name: Copy-Paste Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run jscpd
        # Pinned and --yes so npx resolves a known version rather than whatever is
        # current at run time. ignore-scripts is set via env so it also covers the
        # on-demand install npx performs before executing.
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: npx --yes jscpd@5.0.14 --min-lines 5 --threshold 5 --ignore 'assets/vendor/**,languages/**,.kiro/**'

  a11y:
    name: Accessibility Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check aria attributes in PHP templates
        run: |
          echo "Checking for aria-live on dynamic message containers..."
          grep -r 'aria-live' includes/ || (echo "::error::Missing aria-live on message containers" && exit 1)
          echo "Checking for screen-reader-text in JS..."
          grep -r 'screen-reader-text' assets/js/ || true
          echo "All a11y checks passed"
