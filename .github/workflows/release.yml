name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'

      - name: Validate version and changelog consistency
        # Guards against shipping a release where the version wasn't actually
        # bumped and/or nobody documented what changed — both of which have
        # happened on this plugin before (the very tag this guard was added
        # under, v1.2.0, points at a commit from months earlier; the plugin
        # header still reads 1.2.0 with none of the work merged since then
        # reflected in it, and readme.txt's changelog has never carried an
        # entry for that version at all). Every check below must pass before
        # the build/publish steps run.
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ESCAPED_VERSION=$(printf '%s' "$TAG_VERSION" | sed 's/[.[\*^$/]/\\&/g')

          PLUGIN_FILE=$(find . -maxdepth 1 -name '*.php' -exec grep -l 'Plugin Name:' {} \; | head -1)
          if [ -z "$PLUGIN_FILE" ]; then
            echo "::error::No main plugin file found"
            exit 1
          fi

          # 1. The plugin header's Version must match the tag (pre-existing check).
          FILE_VERSION=$(grep -oP 'Version:\s*\K[0-9.]+' "$PLUGIN_FILE")
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match plugin version ($FILE_VERSION) in $PLUGIN_FILE"
            exit 1
          fi

          # 2. readme.txt's Stable tag must match too — WordPress.org reads that
          #    field, not the plugin header, to decide what version is "current".
          README_STABLE=$(grep -oP '^Stable tag:\s*\K[0-9.]+' readme.txt || true)
          if [ "$TAG_VERSION" != "$README_STABLE" ]; then
            echo "::error::readme.txt's Stable tag ($README_STABLE) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

          # 3. readme.txt's == Changelog == section must document this exact
          #    version — not just an unpromoted "= Unreleased =" entry.
          if ! grep -qE "^= ${ESCAPED_VERSION} =\$" readme.txt; then
            echo "::error::readme.txt has no '= ${TAG_VERSION} =' changelog entry. Promote the Unreleased entry (or add one) before tagging."
            exit 1
          fi

          # 4. changelog.txt must document this exact version too, in its own
          #    '## Version X.Y.Z' convention (an optional ' - Title' suffix is
          #    allowed, matching how every prior entry in the file is written).
          if ! grep -qE "^## Version ${ESCAPED_VERSION}( |\$)" changelog.txt; then
            echo "::error::changelog.txt has no '## Version ${TAG_VERSION}' entry. Promote the Unreleased entry (or add one) before tagging."
            exit 1
          fi

          # 5. The version must have actually moved since the previous release
          #    tag — re-tagging the same version number is exactly the bug this
          #    guard exists to catch, not a hygiene nicety.
          PREV_TAG=$(git tag --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            PREV_VERSION="${PREV_TAG#v}"
            if [ "$PREV_VERSION" = "$TAG_VERSION" ]; then
              echo "::error::Version $TAG_VERSION is identical to the previous release ($PREV_TAG). Bump the version before releasing."
              exit 1
            fi

            # 6. Both changelog files must have actually been touched since
            #    that previous release — not merely contain a heading that
            #    happens to match (belt-and-suspenders against hand-editing
            #    only one of the two, or copy-pasting a heading with no body).
            if git diff --quiet "$PREV_TAG" HEAD -- changelog.txt; then
              echo "::error::changelog.txt has no changes since $PREV_TAG. Document this release before tagging."
              exit 1
            fi
            if git diff --quiet "$PREV_TAG" HEAD -- readme.txt; then
              echo "::error::readme.txt has no changes since $PREV_TAG. Document this release before tagging."
              exit 1
            fi
          else
            echo "::notice::No previous release tag found — skipping the version-moved/changelog-diff checks (first release)."
          fi

          echo "Version $TAG_VERSION validated: plugin header, readme.txt Stable tag, and both changelogs agree."

      - name: Install composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader 2>/dev/null || true

      - name: Minify JS and CSS
        run: |
          # These two produce the admin.min.js/.css that ship to production sites,
          # so an unpinned install here is a direct supply-chain path into the
          # plugin. Exact versions, and no lifecycle scripts (neither package runs
          # any on a registry install).
          npm install -g --ignore-scripts terser@5.49.2 csso-cli@4.0.2
          # Minify JS files (skip already-minified vendor files)
          find assets/js -name '*.js' ! -name '*.min.js' -exec sh -c '
            terser "$1" --compress --mangle --output "${1%.js}.min.js"
          ' _ {} \;
          # Minify CSS files (skip already-minified vendor files)
          find assets/css -name '*.css' ! -name '*.min.css' -exec sh -c '
            csso "$1" --output "${1%.css}.min.css"
          ' _ {} \;

      - name: Optimize images
        run: |
          sudo apt-get install -y --no-install-recommends optipng jpegoptim svgo 2>/dev/null || true
          find assets -name '*.png' -exec optipng -o5 -quiet {} \; 2>/dev/null || true
          find assets -name '*.jpg' -o -name '*.jpeg' | xargs -r jpegoptim --strip-all --max=85 2>/dev/null || true
          find assets -name '*.svg' -exec svgo --quiet {} \; 2>/dev/null || true
          echo "Image optimization complete"

      - name: Build ZIP
        run: |
          PLUGIN_SLUG=$(basename "$GITHUB_REPOSITORY")
          mkdir -p "$PLUGIN_SLUG"
          rsync -a --exclude="$PLUGIN_SLUG" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.kiro' \
            --exclude='.superpowers' \
            --exclude='docs' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='vendor/bin' \
            . "$PLUGIN_SLUG/"
          zip -r "${PLUGIN_SLUG}.zip" "$PLUGIN_SLUG"
          echo "ZIP_FILE=${PLUGIN_SLUG}.zip" >> "$GITHUB_ENV"
          echo "PLUGIN_SLUG=${PLUGIN_SLUG}" >> "$GITHUB_ENV"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: sbom-${{ env.PLUGIN_SLUG }}.spdx.json

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ env.ZIP_FILE }}
          generate_release_notes: true
