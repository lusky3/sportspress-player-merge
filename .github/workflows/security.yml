name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan (Level 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install WordPress stubs
        # Loosely version-constrained (caret) so a future major release of any
        # of these can't silently break this job with no diff in this
        # repository to explain why. Confirmed resolvable with `composer
        # require --dry-run`: locks phpstan/phpstan 2.2.13,
        # szepeviktor/phpstan-wordpress v2.0.4, php-stubs/wordpress-stubs
        # v6.9.4, php-stubs/wp-cli-stubs v2.12.0 — wordpress-stubs is pinned to
        # ^6.0, not the newer v7.x line, because wp-cli-stubs (as of v2.12.0)
        # requires wordpress-stubs ^4.7 || ^5.0 || ^6.0 and cannot resolve
        # against v7.x at all.
        run: composer global require "phpstan/phpstan:^2.0" "szepeviktor/phpstan-wordpress:^2.0" "php-stubs/wordpress-stubs:^6.0" "php-stubs/wp-cli-stubs:^2.0" --no-interaction
      - name: Run PHPStan
        run: ~/.composer/vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        run: semgrep scan --config p/php --config p/wordpress --error

  snyk:
    name: Snyk Code
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: snyk/actions/php@12140f4059e244892ae643824a95459a102120dd # master as of 2026-08
        with:
          command: code test
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # CVE-2025-59844: argument injection in sonarqube-scan-action >= 4.0.0, < 6.0.0.
      # SHA-pinned rather than tag-tracked so the resolved code cannot change under us.
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
